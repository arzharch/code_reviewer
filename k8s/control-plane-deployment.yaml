apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: code-reviewer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: api
          image: autonomous-reviewer-api:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.control_plane.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: code-reviewer-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
