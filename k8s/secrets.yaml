apiVersion: v1
kind: Secret
metadata:
  name: code-reviewer-secrets
  namespace: code-reviewer
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-your-key-here"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres-svc:5432/agent_db"
  REDIS_URL: "redis://redis-svc:6379"
  GITHUB_APP_ID: "12345"
  GITHUB_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    ...
    -----END RSA PRIVATE KEY-----
  GITHUB_WEBHOOK_SECRET: "your_webhook_secret"
