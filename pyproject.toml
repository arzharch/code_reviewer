[project]
name = "autonomous-code-reviewer"
version = "0.1.0"
description = "Autonomous Code Review & Refactoring Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "langgraph>=0.1.0",
    "langgraph-checkpoint-postgres>=1.0.1",
    "langchain-openai>=0.1.0",
    "sqlalchemy>=2.0.31",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.7",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.4",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
    "psycopg[binary]>=3.1.8",
    "requests>=2.32.0",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
# Static-analysis binaries the agent shells out to. These are runtime
# dependencies of the agent, not dev tooling: without them
# StaticAnalysisService silently returns zero findings.
analysis = [
    "ruff>=0.5.0",
    "mypy>=1.10.1",
    "bandit>=1.7.9",
    "radon>=6.0.1",
]
dev = [
    "autonomous-code-reviewer[analysis]",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
]

[project.scripts]
autonomous-reviewer = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
# Deliberately vulnerable sample files used to exercise the reviewer.
exclude = ["tests/fixtures"]
