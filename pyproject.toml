[tool.poetry]
name = "autonomous-code-reviewer"
version = "0.1.0"
description = "Autonomous Code Review & Refactoring Agent"
authors = ["AI Assistant <ai@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
langgraph = "^0.1.0"
langchain-openai = "^0.1.0"
sqlalchemy = "^2.0.31"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
redis = "^5.0.7"
pydantic = "^2.8.0"
pydantic-settings = "^2.3.4"
httpx = "^0.27.0"
pygithub = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
ruff = "^0.5.0"
mypy = "^1.10.1"
bandit = "^1.7.9"
radon = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
