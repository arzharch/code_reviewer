[project]
name = "autonomous-code-reviewer"
version = "0.1.0"
description = "Autonomous Code Review & Refactoring Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "langgraph>=0.1.0",
    "langgraph-checkpoint-postgres>=1.0.1",
    "langchain-openai>=0.1.0",
    "sqlalchemy>=2.0.31",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.7",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.4",
    "httpx>=0.27.0",
    "pygithub>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5.0",
    "mypy>=1.10.1",
    "bandit>=1.7.9",
    "radon>=6.0.1",
]

[project.scripts]
autonomous-reviewer = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py311"
